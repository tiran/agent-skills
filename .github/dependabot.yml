version: 2
updates:
  # GitHub Actions is the only Dependabot-tracked ecosystem here (the Python side
  # is stdlib; pre-commit hook revs are updated with `uvx pre-commit autoupdate`).
  # Dependabot bumps the SHA pins and rewrites the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a bad/compromised release be caught before adopting
    groups:
      actions:
        patterns:
          - "*" # one PR for all action bumps; keeps review churn low
