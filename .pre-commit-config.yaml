# Repo dogfoods the tooling its own skills recommend (uvx, ruff, zizmor).
# Run locally with `uvx pre-commit run --all-files`; CI runs the same config.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # secure-python-release-pipeline §7: zizmor audits the workflow's security.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: skill-frontmatter
        name: validate SKILL.md frontmatter
        entry: python .github/tools/check_skill_frontmatter.py
        language: python
        additional_dependencies: [pyyaml]
        files: ^skills/.*/SKILL\.md$
        pass_filenames: false
      - id: plugin-manifests
        name: guard plugin manifests (no 'version', names agree)
        entry: python .github/tools/check_plugin_manifests.py
        language: python
        files: ^(plugin\.json|\.claude-plugin/plugin\.json)$
        pass_filenames: false
